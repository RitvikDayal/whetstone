name: ci
on:
  push: { branches: [main] }
  pull_request:

# Read-only. CI runs tests; it never merges, publishes, or writes to the repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHAs: a tag is mutable, and .coderabbit.yaml asks
      # reviewers to flag tag pins. Both majors run on node24; the v4/v3 pair
      # this replaces was node20, which Actions has deprecated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # BEFORE `uv sync`, and the order is load-bearing. `uv sync`
      # editable-installs the project, which invokes the build backend, which
      # runs `hatch_build.py`. With no bundle present and no Node on PATH that
      # hook can only warn -- so the front-end has to exist before Python is
      # touched, or the wheel test below is measuring a bundle CI built by
      # accident rather than one it built on purpose.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/whetstone/ui/package-lock.json
      - run: npm ci
        working-directory: src/whetstone/ui
      - run: npm run build
        working-directory: src/whetstone/ui
      - run: uv python install ${{ matrix.python }}
      # --python, or the matrix is decorative. `requires-python = ">=3.11"`
      # means uv is free to pick ANY compatible interpreter it finds, and the
      # runner ships one of its own -- so both legs could resolve to the same
      # version while the job names claimed otherwise. Installing 3.11 does not
      # make `uv sync` choose it; asking for it does.
      - run: uv sync --python ${{ matrix.python }} --all-groups --all-extras
      # The browser binary, on EVERY leg. Without it every rendered-ui test
      # SKIPS and the leg stays green -- the "check that quietly does not run"
      # defect, in the tests written to prove the browser lens works. This was
      # Linux-only, so the two Windows legs were passing with no rendered-ui
      # coverage at all; `tests/_browser.py` now fails rather than skips
      # wherever CI is set, which makes a missing install loud on all four.
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  # A WHEEL IS BUILT AND READ, on one leg only because the artifact is
  # platform-independent and building it four times proves nothing four times.
  #
  # This exists because `tests/unit/test_package.py` opens a built wheel and
  # asserts the control plane is inside it, and until now nothing in CI ever
  # built one -- `uv build` appears only in release.yml. A packaging gate that
  # runs for the first time during a release is a gate that fails during a
  # release.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/whetstone/ui/package-lock.json
      - run: npm ci
        working-directory: src/whetstone/ui
      - run: npm run build
        working-directory: src/whetstone/ui
      - run: uv sync --all-groups --all-extras
      - run: uv run pytest tests/unit/test_package.py -q
      # And the wheel actually installs and runs, from a clean environment
      # that has never seen this source tree. `--no-cache` so a stale build
      # cannot stand in for the one just produced.
      - run: uv build --wheel
      - run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python --no-cache dist/*.whl
          /tmp/clean/bin/whetstone version
