# Verify, build, and publish on a tag -- and only on a tag, and only after a
# human approves the deployment.
#
# NOTHING HERE RUNS UNTIL SOMEBODY PUSHES `v*`. A merge to `main` cannot start
# it, and neither can a workflow_dispatch, because there is not one.
#
# THE TESTS RUN AGAIN HERE rather than trusting the CI run on the merge commit.
# A tag can point at any commit, including one CI never saw, and "it was green on
# main" is not the same claim as "it is green at the thing being published".
#
# THE PUBLISHING CREDENTIAL IS BEHIND A HUMAN. Only the `publish` job asks for
# `id-token: write`, and it cannot start until a reviewer approves the `release`
# environment -- a rule stored in repository settings, out of reach of the
# commit being tagged. `verify` and `build` hold nothing but `contents: read`.
#
# TRUSTED PUBLISHING, so there is no API token in a secret at all. PyPI must
# have a publisher configured for this repository AND this workflow filename
# before the first release goes through; renaming this file breaks the identity
# it asserts.
name: release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; only `publish` asks for the one extra it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install ${{ matrix.python }}
      # --python for the same reason ci.yml gives: without it the matrix does
      # not bind, and a release could be verified twice on one interpreter.
      - run: uv sync --python ${{ matrix.python }} --all-groups --all-extras
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build

      # THE TAG MUST MATCH THE VERSION IN THE WHEEL. Without this, `v0.2.0`
      # pointing at a tree that still says 0.1.0 publishes 0.1.0 and quietly
      # fails as "file already exists" -- or worse, succeeds and ships something
      # nobody asked for under a name nobody expects.
      - name: The tag and the built version agree
        run: |
          set -eu
          # GLOB, NOT `ls` (SC2012). And the count is checked first: with
          # two wheels in dist/ the old pipeline silently compared the
          # version of whichever one `ls` sorted first, so a stale artifact
          # could pass the check whose whole job is catching a wrong one.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          built=$(basename "${wheels[0]}" | sed -E 's/^whetstone_cli-([^-]+)-.*/\1/')
          tagged="${GITHUB_REF_NAME#v}"
          echo "tag=$tagged built=$built"
          test "$built" = "$tagged"

      # A wheel that imports is a weaker claim than one that runs, and the
      # entry point is the thing every user touches first. Installed from the
      # BUILT ARTIFACT into a clean venv, with no source tree on the path --
      # which is how a missing package data file shows up, and it cannot show
      # up any other way.
      - name: The built wheel runs
        run: |
          set -eu
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/whetstone version
          /tmp/fresh/bin/whetstone --help > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # THE ENVIRONMENT IS THE GATE, and that is the whole design.
    #
    # This job previously did not exist, and before that it was gated on
    # `if: vars.PUBLISH_TO_PYPI == 'true'`. That gate was worthless: a tag push
    # runs the workflow definition FROM THE TAGGED COMMIT, and Trusted
    # Publishing identifies the repository and the workflow filename rather
    # than a commit SHA -- so anything able to push a commit and a `v*` tag
    # could delete the `if:` in the same commit it tagged. A check the attacker
    # edits is not a check.
    #
    # `environment: release` is different in kind. Its required-reviewer rule
    # lives in repository settings, NOT in the tree being tagged, so the tagged
    # commit cannot weaken it. The job pauses until a reviewer approves the
    # deployment. Verified present rather than assumed: the environment exists
    # with a `required_reviewers` protection rule, which it could not have while
    # the repository was private on this plan -- the API answered 404 for the
    # environment and 403 for rulesets.
    #
    # A `v*` tag ruleset covers the other half: release tags cannot be deleted
    # or force-updated, so a published version cannot later point at different
    # code.
    #
    # WHAT THIS GATE DOES NOT DEFEND AGAINST, said plainly so nobody reads more
    # into it. `prevent_self_review` is OFF, because this repository has exactly
    # one collaborator: the only account that can push a `v*` tag is also the
    # only account that can approve the deployment. Turning it on would not add
    # a second pair of eyes -- there is no second pair -- it would deadlock
    # releases outright.
    #
    # So the gate stops an UNATTENDED publish: a tag pushed by a script, a
    # mis-typed command, or a workflow, none of which can click approve. It does
    # NOT stop a compromised maintainer account, and no configuration of a
    # single-maintainer repository can. The honest fix is a second maintainer,
    # and until there is one this is a smaller claim than it looks.
    environment: release
    permissions:
      # Trusted Publishing exchanges this for a short-lived PyPI credential.
      # No token, no `password:`. This is the only job that gets it, and it
      # cannot start until a human approves the deployment.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
