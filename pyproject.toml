[project]
name = "whetstone-cli"
version = "0.1.0"
description = "Evidence-gated project improvement — finds real issues in your code and your running app"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ritvik Dayal" }]
keywords = ["static-analysis", "code-quality", "agents", "developer-tools"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pathspec>=0.12,<2",
    "jinja2>=3.1",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# The browser lens only. An OPTIONAL extra rather than a runtime dependency,
# because Playwright pulls a browser download of a few hundred megabytes and
# most people run `hygiene` and `code-defects` and never a browser at all --
# the same argument that keeps pip-audit out of `dependencies`. Installing
# `whetstone` should not cost a Chromium build.
#
# The lens reports its absence and says so, exactly as `deps` does for a
# missing pip-audit. It never silently skips.
browser = ["playwright>=1.47"]

[project.scripts]
whetstone = "whetstone.cli:app"

[project.urls]
Homepage = "https://whetstone.sh"
Source = "https://github.com/RitvikDayal/whetstone"

[dependency-groups]
# pip-audit is a DEV dependency, not a runtime one: the hygiene lens shells out
# to whatever pip-audit the user installed, and deliberately reports nothing and
# says so when there is none. It is pinned here because the regression tests for
# the ambient-environment defect run the real tool, and a test that silently
# never runs is how that defect survived three review passes.
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "pip-audit>=2.9", "playwright>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
