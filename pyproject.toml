[project]
name = "whetstone-cli"
version = "0.0.1"
description = "Evidence-gated project improvement — finds real issues in your code and your running app"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ritvik Dayal" }]
keywords = ["static-analysis", "code-quality", "agents", "developer-tools"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pathspec>=0.12,<2",
    "jinja2>=3.1",
]

[project.scripts]
whetstone = "whetstone.cli:app"

[project.urls]
Homepage = "https://whetstone.sh"
Source = "https://github.com/RitvikDayal/whetstone"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
