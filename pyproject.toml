[project]
name = "whetstone-cli"
version = "0.1.0"
description = "Evidence-gated project improvement — finds real issues in your code and your running app"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ritvik Dayal" }]
keywords = [
    "static-analysis",
    "code-quality",
    "agents",
    "llm",
    "developer-tools",
    "code-review",
    "testing",
]

# NO `License ::` CLASSIFIER. `license = "AGPL-3.0-or-later"` above is a PEP 639
# SPDX expression, and 639 DEPRECATES the licence classifiers in favour of it --
# the classifier is the pre-639 spelling of the same fact, and two spellings of
# one fact is what 639 exists to end.
#
# Stated carefully, because an earlier version of this comment claimed PyPI
# "rejects a distribution that carries both". PyPI's mandatory rejection is for
# a distribution carrying both the legacy `License` FIELD and
# `License-Expression`; a classifier alongside an expression is deprecated
# rather than refused. Omitting it is still right, but for the smaller reason.
#
# `3 - Alpha`, not Beta, and the README says the same thing in words: the
# pipeline has been run against real defects, and how REPRODUCIBLE the
# falsifier's judgement is remains unsettled (issue #33). A classifier that
# claims more than the README is a claim nobody reads twice.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pathspec>=0.12,<2",
    "jinja2>=3.1",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# The browser lens only. An OPTIONAL extra rather than a runtime dependency,
# because Playwright pulls a browser download of a few hundred megabytes and
# most people run `hygiene` and `code-defects` and never a browser at all --
# the same argument that keeps pip-audit out of `dependencies`. Installing
# `whetstone` should not cost a Chromium build.
#
# The lens reports its absence and says so, exactly as `deps` does for a
# missing pip-audit. It never silently skips.
browser = ["playwright>=1.47"]

# The control plane. Same argument as `browser` one line up: installing
# Whetstone to run `hygiene` in CI should not also install a web server. The
# BUILT ASSETS ship in the base wheel regardless -- they are a few hundred
# kilobytes, and splitting them from the extra would give the extra two
# different failure modes instead of one.
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
whetstone = "whetstone.cli:app"

# `whetstone.sh` WAS HERE AND DOES NOT EXIST -- `nslookup` returns NXDOMAIN.
# It would have shipped as the Homepage link on the PyPI project page, which is
# the first thing anyone clicks. A URL nobody registered is worse than no URL:
# the second is an absence, the first is a dead end that looks intentional.
[project.urls]
Homepage = "https://github.com/RitvikDayal/whetstone"
Source = "https://github.com/RitvikDayal/whetstone"
Issues = "https://github.com/RitvikDayal/whetstone/issues"
Changelog = "https://github.com/RitvikDayal/whetstone/blob/main/CHANGELOG.md"

[dependency-groups]
# pip-audit is a DEV dependency, not a runtime one: the hygiene lens shells out
# to whatever pip-audit the user installed, and deliberately reports nothing and
# says so when there is none. It is pinned here because the regression tests for
# the ambient-environment defect run the real tool, and a test that silently
# never runs is how that defect survived three review passes.
# `build` and `hatchling` are here so `tests/unit/test_package.py` can build a
# real wheel and read its zip. Without them that test would have to skip when
# no wheel happened to be lying around -- and the thing it guards is a wheel
# that silently ships without its front-end, so a skip is the failure mode.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pip-audit>=2.9",
    "playwright>=1.47",
    "build>=1.2",
    "hatchling>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Builds the control plane's front-end when there is one to build. Read
# `hatch_build.py`'s docstring before changing it -- the hook is a convenience
# and `tests/unit/test_package.py` is the gate, and which is which was measured
# rather than assumed.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# THE BUILT UI, STATED EXPLICITLY, and this is not belt-and-braces -- without
# it the control plane ships in nothing. Hatchling's default file selection is
# VCS-ignore-aware, and `.gitignore` carries an unanchored `dist/` for the
# Python build directory, which also matches `src/whetstone/ui/dist/`.
# Measured: `git check-ignore -v src/whetstone/ui/dist/index.html` resolves to
# `.gitignore:6`, and a wheel built without this stanza contained zero entries
# under `whetstone/ui/` while every other non-Python data file -- prompts,
# schemas -- was present.
#
# That is precisely the failure this milestone was most afraid of, a wheel
# that silently ships an empty UI, arriving through a door nobody checked.
# `artifacts` is exempt from `exclude` and from the VCS ignore rules, which is
# why it is the right instrument. Declared at `[tool.hatch.build]` rather than
# per target so the sdist carries them too -- that is what lets an sdist
# install work on a machine with no Node.
#
# `tests/unit/test_package.py` reads the built wheel's zip and fails if these
# are missing. That test, not this stanza, is the enforcing mechanism.
[tool.hatch.build]
artifacts = ["src/whetstone/ui/dist/**"]

# ...and everything else under `ui/` stays OUT. `artifacts` re-includes the
# built bundle; without these excludes the wheel also carried the front-end
# SOURCE and the whole of `node_modules` -- measured at over three thousand
# entries, including `.bin` shims and a nested lockfile. A wheel is not a
# development checkout, and nothing here is importable Python.
#
# `node_modules/` is named explicitly rather than left to `ui/.gitignore`:
# relying on a nested ignore file to keep tens of megabytes out of a published
# artifact is a promise, and the measurement above is what it is worth.
exclude = [
  "src/whetstone/ui/node_modules/**",
  "src/whetstone/ui/src/**",
  "src/whetstone/ui/index.html",
  "src/whetstone/ui/package.json",
  "src/whetstone/ui/package-lock.json",
  "src/whetstone/ui/tsconfig.json",
  "src/whetstone/ui/vite.config.ts",
  "src/whetstone/ui/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
